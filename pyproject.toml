[project]
name = "openwb2mqtt"
version = "1.0.2"
description = "Home Assistant custom integration for openWB 2.x wallboxes via MQTT or the simpleAPI"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = [
    "E501",  # line length is handled by the formatter
    "UP047",  # PEP 695 generics: changed together with the common.py refactor
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "custom_components"]
combine-as-imports = true
